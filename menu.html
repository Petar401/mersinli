  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section aria-labelledby=\"step-style\" style=\"display:flex;flex-direction:column;gap:20px\">\n    <h2 id=\"step-style\" style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(28px,3vw,38px);display:flex;gap:14px;align-items:baseline\"><span style=\"color:#F47B20\">2.<\u002Fspan>How would you like it?<\u002Fh2>\n    <div role=\"radiogroup\" aria-label=\"Serving\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px\">\n      <sc-for list=\"{{ formats }}\" as=\"f\" hint-placeholder-count=\"3\">\n        <button type=\"button\" role=\"radio\" aria-checked=\"{{ f.checked }}\" sc-camel-on-click=\"{{ f.pick }}\" style=\"text-align:left;padding:18px 20px;border-radius:18px;border:2px solid {{ f.border }};background:{{ f.bg }};cursor:pointer;display:flex;flex-direction:column;gap:6px;color:#2B0F0A;min-height:44px\">\n          <span style=\"display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:17px\"><span>{{ f.name }}<\u002Fspan><span style=\"color:#D62718\">{{ f.addLabel }}<\u002Fspan><\u002Fspan>\n          <span style=\"font-size:14px;line-height:1.45;color:#6E3F2E\">{{ f.sub }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:28px;align-items:center;justify-content:space-between;padding-top:6px\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-size:13px;letter-spacing:0.16em;text-transform:uppercase;font-weight:700;color:#6E3F2E\">Chilli (pul biber)<\u002Fspan>\n        <div role=\"radiogroup\" aria-label=\"Chilli level\" style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <sc-for list=\"{{ spices }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <button type=\"button\" role=\"radio\" aria-checked=\"{{ s.checked }}\" sc-camel-on-click=\"{{ s.pick }}\" style=\"padding:10px 18px;min-height:44px;border-radius:999px;border:1.5px solid {{ s.border }};background:{{ s.bg }};color:{{ s.fg }};font-weight:600;font-size:15px;cursor:pointer\">{{ s.name }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-size:13px;letter-spacing:0.16em;text-transform:uppercase;font-weight:700;color:#6E3F2E\">Quantity<\u002Fspan>\n        <div style=\"display:flex;align-items:center;gap:4px;background:#FFF9F1;border:1px solid #F1D9C0;border-radius:999px;padding:4px\">\n          <button type=\"button\" aria-label=\"Decrease quantity\" sc-camel-on-click=\"{{ qtyDown }}\" style=\"width:40px;height:40px;border-radius:50%;border:0;background:transparent;font-size:20px;cursor:pointer;color:#2B0F0A\" style-hover=\"background:#FBE3CB\">−<\u002Fbutton>\n          <span style=\"min-width:32px;text-align:center;font-weight:700;font-size:18px\">{{ qty }}<\u002Fspan>\n          <button type=\"button\" aria-label=\"Increase quantity\" sc-camel-on-click=\"{{ qtyUp }}\" style=\"width:40px;height:40px;border-radius:50%;border:0;background:transparent;font-size:20px;cursor:pointer;color:#2B0F0A\" style-hover=\"background:#FBE3CB\">+<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button type=\"button\" sc-camel-on-click=\"{{ addTantuni }}\" style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;padding:20px 28px;border:0;border-radius:999px;background:#D62718;color:#FFF9F1;font-size:18px;font-weight:700;cursor:pointer\" style-hover=\"background:#B21E12\">\n      <span>{{ addLabel }}<\u002Fspan><span>{{ lineTotal }}<\u002Fspan>\n    <\u002Fbutton>\n    <sc-if value=\"{{ flash }}\" hint-placeholder-val=\"{{ false }}\">\n      <p role=\"status\" style=\"margin:-6px 0 0;color:#C81E12;font-weight:600;font-size:15px\">{{ flashText }}<\u002Fp>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <section id=\"drinks\" aria-labelledby=\"step-drinks\" style=\"display:flex;flex-direction:column;gap:20px;scroll-margin-top:90px\">\n    <div style=\"display:flex;flex-direction:column;gap:6px\">\n      <h2 id=\"step-drinks\" style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(28px,3vw,38px);display:flex;gap:14px;align-items:baseline\"><span style=\"color:#F47B20\">3.<\u002Fspan>Add a drink<\u002Fh2>\n      <p style=\"margin:0;font-size:16px;color:#6E3F2E\">In Mersin they drink it with şalgam. Every drink is £1.50.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px\">\n      <sc-for list=\"{{ drinks }}\" as=\"d\" hint-placeholder-count=\"6\">\n        <article style=\"background:#FFF9F1;border:1px solid #F1D9C0;border-radius:20px;overflow:hidden;display:flex;flex-direction:column\">\n          <img src=\"{{ d.img }}\" alt=\"{{ d.name }}\" loading=\"lazy\" style=\"width:100%;aspect-ratio:1;object-fit:cover;display:block\">\n          <div style=\"padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1\">\n            <div style=\"display:flex;flex-direction:column;gap:2px;flex:1\">\n              <h3 style=\"margin:0;font-size:16px;font-weight:700\">{{ d.name }}<\u002Fh3>\n              <span style=\"font-size:13px;color:#6E3F2E\">{{ d.sub }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px\">\n              <span style=\"font-weight:700\">{{ d.priceLabel }}<\u002Fspan>\n              <sc-if value=\"{{ d.inBasket }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:center;gap:2px;background:#C81E12;color:#FFF3E3;border-radius:999px;padding:2px\">\n                  <button type=\"button\" aria-label=\"Remove one\" sc-camel-on-click=\"{{ d.dec }}\" style=\"width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:#FFF3E3;font-size:18px;cursor:pointer\">−<\u002Fbutton>\n                  <span style=\"min-width:18px;text-align:center;font-weight:700\">{{ d.qty }}<\u002Fspan>\n                  <button type=\"button\" aria-label=\"Add one\" sc-camel-on-click=\"{{ d.inc }}\" style=\"width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:#FFF3E3;font-size:18px;cursor:pointer\">+<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ d.notInBasket }}\" hint-placeholder-val=\"{{ true }}\">\n                <button type=\"button\" sc-camel-on-click=\"{{ d.inc }}\" style=\"height:40px;padding:0 16px;border-radius:999px;border:1.5px solid #C81E12;background:transparent;color:#C81E12;font-weight:700;cursor:pointer\" style-hover=\"background:#C81E12;color:#FFF3E3\">Add<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n\n<aside id=\"basket\" aria-labelledby=\"basket-title\" style=\"flex:1 1 340px;max-width:100%;position:sticky;top:92px;scroll-margin-top:92px;background:#FFF9F1;border:1px solid #F1D9C0;border-radius:28px;overflow:hidden\">\n  <div aria-hidden=\"true\" style=\"height:10px;background:repeating-linear-gradient(90deg,#D62718 0 18px,#FFF9F1 18px 22px,#F47B20 22px 40px,#FFF9F1 40px 44px)\"><\u002Fdiv>\n  <div style=\"padding:24px 24px 28px;display:flex;flex-direction:column;gap:18px\">\n\n    <sc-if value=\"{{ isBasket }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <h2 id=\"basket-title\" style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:30px\">Your order<\u002Fh2>\n        <sc-if value=\"{{ empty }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"margin:0;padding:28px 0;text-align:center;color:#6E3F2E;font-size:16px;line-height:1.5;border:1.5px dashed #EFCFAE;border-radius:18px\">Your order is empty.<br>Pick a meat to get started.<\u002Fp>\n        <\u002Fsc-if>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column\">\n          <sc-for list=\"{{ lines }}\" as=\"l\" hint-placeholder-count=\"0\">\n            <li style=\"display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #F6E2CC\">\n              <img src=\"{{ l.img }}\" alt=\"\" style=\"width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none\">\n              <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:2px\">\n                <span style=\"font-weight:700;font-size:15px\">{{ l.name }}<\u002Fspan>\n                <span style=\"font-size:13px;color:#6E3F2E\">{{ l.detail }}<\u002Fspan>\n                <div style=\"display:flex;align-items:center;gap:10px;margin-top:4px\">\n                  <button type=\"button\" aria-label=\"Remove one\" sc-camel-on-click=\"{{ l.dec }}\" style=\"width:28px;height:28px;border-radius:50%;border:1px solid #EFCFAE;background:transparent;cursor:pointer;color:#2B0F0A\">−<\u002Fbutton>\n                  <span style=\"font-weight:700;font-size:14px\">{{ l.qty }}<\u002Fspan>\n                  <button type=\"button\" aria-label=\"Add one\" sc-camel-on-click=\"{{ l.inc }}\" style=\"width:28px;height:28px;border-radius:50%;border:1px solid #EFCFAE;background:transparent;cursor:pointer;color:#2B0F0A\">+<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-weight:700;font-size:15px\">{{ l.total }}<\u002Fspan>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;font-size:15px;color:#6E3F2E\"><span>Collection from<\u002Fspan><span>1 Exeter Street<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-weight:700;font-size:18px\">Total<\u002Fspan><span style=\"font-family:'DM Serif Display',serif;font-size:32px\">{{ total }}<\u002Fspan><\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ toCheckout }}\" disabled=\"{{ empty }}\" style=\"padding:18px;border:0;border-radius:999px;background:{{ checkoutBg }};color:#FFF9F1;font-size:17px;font-weight:700;cursor:pointer\">Checkout<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isCheckout }}\" hint-placeholder-val=\"{{ false }}\">\n      <form sc-camel-on-submit=\"{{ placeOrder }}\" style=\"display:flex;flex-direction:column;gap:14px\">\n        <button type=\"button\" sc-camel-on-click=\"{{ toBasket }}\" style=\"align-self:flex-start;border:0;background:transparent;padding:0;color:#D62718;font-weight:600;cursor:pointer;font-size:15px\">Back to your order<\u002Fbutton>\n        <h2 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:30px\">Collection details<\u002Fh2>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600\">Name\n          <input required=\"\" value=\"{{ name }}\" sc-camel-on-change=\"{{ setName }}\" sc-camel-auto-complete=\"name\" style=\"height:48px;padding:0 14px;border-radius:12px;border:1.5px solid #EFCFAE;background:#FFFDF8;font-size:16px;color:#2B0F0A\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600\">Phone\n          <input required=\"\" type=\"tel\" value=\"{{ phone }}\" sc-camel-on-change=\"{{ setPhone }}\" sc-camel-auto-complete=\"tel\" style=\"height:48px;padding:0 14px;border-radius:12px;border:1.5px solid #EFCFAE;background:#FFFDF8;font-size:16px;color:#2B0F0A\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600\">Collection time\n          <sc-raw-select value=\"{{ time }}\" sc-camel-on-change=\"{{ setTime }}\" style=\"height:48px;padding:0 12px;border-radius:12px;border:1.5px solid #EFCFAE;background:#FFFDF8;font-size:16px;color:#2B0F0A\">\n            <sc-for list=\"{{ times }}\" as=\"t\" hint-placeholder-count=\"1\">\n              <option value=\"{{ t }}\">{{ t }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600\">Notes (optional)\n          <textarea value=\"{{ notes }}\" sc-camel-on-change=\"{{ setNotes }}\" rows=\"2\" placeholder=\"No onions, extra chilli, that sort of thing\" style=\"padding:12px 14px;border-radius:12px;border:1.5px solid #EFCFAE;background:#FFFDF8;font-size:16px;color:#2B0F0A;resize:vertical\"><\u002Ftextarea>\n        <\u002Flabel>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding-top:6px\"><span style=\"font-weight:700;font-size:18px\">{{ count }} items<\u002Fspan><span style=\"font-family:'DM Serif Display',serif;font-size:32px\">{{ total }}<\u002Fspan><\u002Fdiv>\n        <button type=\"submit\" style=\"padding:18px;border:0;border-radius:999px;background:#D62718;color:#FFF9F1;font-size:17px;font-weight:700;cursor:pointer\" style-hover=\"background:#B21E12\">Place order and pay when you collect<\u002Fbutton>\n      <\u002Fform>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isDone }}\" hint-placeholder-val=\"{{ false }}\">\n      <div role=\"status\" style=\"display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center;padding:12px 0\">\n                <h2 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:32px\">Teşekkürler, {{ firstName }}!<\u002Fh2>\n        <p style=\"margin:0;font-size:16px;line-height:1.55;color:#6E3F2E\">Your order number is <strong style=\"color:#2B0F0A\">{{ orderNo }}<\u002Fstrong>. Come and pick it up at <strong style=\"color:#2B0F0A\">{{ time }}<\u002Fstrong> from 1 Exeter Street, Norwich NR2 4QB.<\u002Fp>\n        <button type=\"button\" sc-camel-on-click=\"{{ newOrder }}\" style=\"padding:14px 24px;border:1.5px solid #2B0F0A;border-radius:999px;background:transparent;color:#2B0F0A;font-weight:700;cursor:pointer;font-size:15px\">Start a new order<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Faside>\n<\u002Fmain>\n\n<sc-if value=\"{{ showBar }}\" hint-placeholder-val=\"{{ false }}\">\n  <a href=\"#basket\" style=\"position:fixed;left:16px;right:16px;bottom:16px;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-radius:999px;background:#2B0F0A;color:#FFF3E3;text-decoration:none;font-weight:700;box-shadow:0 12px 30px -10px rgba(43,15,10,0.6)\"><span>View your order ({{ count }})<\u002Fspan><span>{{ total }}<\u002Fspan><\u002Fa>\n<\u002Fsc-if>\n\n<footer style=\"background:#2B0F0A;color:#F6DCC6\">\n  <div style=\"max-width:1320px;margin:0 auto;padding:36px clamp(16px,4vw,40px);display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;font-size:15px\">\n    <span>Mersinli Tantuni by Choban, 1 Exeter Street, Norwich NR2 4QB<\u002Fspan>\n    <span>Open every day, 11am to 11pm. Prices include VAT.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  MEATS = [\n    { id: 'beef', name: 'Beef', tr: 'Et, the original', price: 6.5, img: '/assets/tantuni-plate-marble.jpg', pos: 'center', alt: 'Beef tantuni on a plate', desc: 'The classic Mersin recipe. Rich and peppery.' },\n    { id: 'lamb', name: 'Lamb', tr: 'Kuzu', price: 6.5, img: '/assets/tantuni-wraps-cut.jpg', pos: 'center', alt: 'Lamb tantuni wraps cut open', desc: 'A little sweeter and richer than beef.' },\n    { id: 'chicken', name: 'Chicken', tr: 'Tavuk', price: 6.5, img: '/assets/tantuni-plate-white.jpg', pos: 'center', alt: 'Chicken tantuni on a plate', desc: 'Lighter. Great with extra lemon and chilli.' },\n    { id: 'mix', name: 'Beef and lamb', tr: 'Karışık', price: 6.5, img: '/assets/tantuni-wraps-cut.jpg', pos: 'left', alt: 'Mixed beef and lamb tantuni', desc: 'Half and half, cooked together on the same pan.' }\n  ];\n  FORMATS = [\n    { id: 'durum', name: 'Dürüm wrap', sub: 'One tantuni rolled in lavash', add: 0 },\n    { id: 'plate', name: 'Tantuni plate', sub: 'Served open on lavash with salad, peppers and lemon', add: 0 }\n  ];\n  SPICES = ['Mild', 'Medium', 'Hot'];\n  DRINKS = [\n    { id: 'salgam', name: 'Şalgam', sub: 'Turnib, spicy, 500ml', price: 1.5, img: '/assets/salgam.jpg' },\n    { id: 'ayran-l', name: 'Ayran', sub: 'Istanbul yoghurt drink', price: 1.5, img: '/assets/ayran-istanbul.jpg' },\n    { id: 'ayran-s', name: 'Ayran small', sub: 'Mis, 250ml', price: 1.5, img: '/assets/ayran-mis.jpg' },\n    { id: 'fanta-o', name: 'Fanta Orange', sub: '330ml can', price: 1.5, img: '/assets/fanta-orange.jpg' },\n    { id: 'fanta-l', name: 'Fanta Lemon', sub: '330ml can', price: 1.5, img: '/assets/fanta-lemon.jpg' },\n    { id: 'water', name: 'Hayat Water', sub: 'Still mineral water, 500ml', price: 1.5, img: '/assets/hayat-water.jpg' }\n  ];\n\n  trackRef = React.createRef();\n\n  constructor(p) {\n    super(p);\n    let basket = [];\n    try { basket = JSON.parse(localStorage.getItem('mt_basket') || '[]'); } catch (e) {}\n    const q = new URLSearchParams(location.search).get('meat');\n    this.state = {\n      meat: this.MEATS.some(m => m.id === q) ? q : 'beef',\n      format: 'durum', spice: 'Medium', qty: 1, basket, step: 'basket',\n      name: '', phone: '', time: \"As soon as it's ready (about 15 minutes)\", notes: '', orderNo: '', flash: '',\n      narrow: typeof window !== 'undefined' && window.innerWidth < 980\n    };\n  }\n  componentDidMount() {\n    this.onResize = () => this.setState({ narrow: window.innerWidth < 980 });\n    window.addEventListener('resize', this.onResize);\n    const i = this.MEATS.findIndex(m => m.id === this.state.meat);\n    const el = this.trackRef.current;\n    if (el && i > 0) el.scrollLeft = el.children[i]?.offsetLeft - el.offsetLeft || 0;\n  }\n  componentWillUnmount() { window.removeEventListener('resize', this.onResize); clearTimeout(this.ft); }\n  save(basket) { this.setState({ basket }); try { localStorage.setItem('mt_basket', JSON.stringify(basket)); } catch (e) {} }\n  gbp(n) { return '£' + n.toFixed(2); }\n  change(key, delta) {\n    const b = this.state.basket.map(l => l.key === key ? { ...l, qty: l.qty + delta } : l).filter(l => l.qty > 0);\n    this.save(b);\n  }\n  addLine(line) {\n    const b = [...this.state.basket];\n    const ex = b.find(l => l.key === line.key);\n    if (ex) ex.qty += line.qty; else b.push(line);\n    this.save(b);\n  }\n  scroll(dir) { const el = this.trackRef.current; if (el) el.scrollBy({ left: dir * el.clientWidth * 0.8, behavior: 'smooth' }); }\n  times() {\n    const out = [\"As soon as it's ready (about 15 minutes)\"]; const d = new Date(); d.setMinutes(Math.ceil((d.getMinutes() + 30) / 15) * 15, 0, 0);\n    for (let i = 0; i < 12; i++) { out.push(d.toTimeString().slice(0, 5)); d.setMinutes(d.getMinutes() + 15); }\n    return out;\n  }\n\n  renderVals() {\n    const s = this.state;\n    const meat = this.MEATS.find(m => m.id === s.meat);\n    const fmt = this.FORMATS.find(f => f.id === s.format);\n    const unit = meat.price + fmt.add;\n    const count = s.basket.reduce((a, l) => a + l.qty, 0);\n    const total = s.basket.reduce((a, l) => a + l.qty * l.price, 0);\n    return {\n      trackRef: this.trackRef,\n      scrollLeft: () => this.scroll(-1), scrollRight: () => this.scroll(1),\n      meats: this.MEATS.map(m => {\n        const on = m.id === s.meat;\n        return { ...m, priceLabel: this.gbp(m.price), checked: on ? 'true' : 'false', border: on ? '#D62718' : 'transparent', dot: on ? '#D62718' : 'rgba(43,15,10,0.25)', tick: '', pick: () => this.setState({ meat: m.id }) };\n      }),\n      formats: this.FORMATS.map(f => {\n        const on = f.id === s.format;\n        return { ...f, addLabel: f.add ? '+' + this.gbp(f.add) : '', checked: on ? 'true' : 'false', border: on ? '#D62718' : '#F1D9C0', bg: on ? '#FFF1E2' : '#FFF9F1', pick: () => this.setState({ format: f.id }) };\n      }),\n      spices: this.SPICES.map(n => {\n        const on = n === s.spice;\n        return { name: n, checked: on ? 'true' : 'false', border: on ? '#2B0F0A' : '#EFCFAE', bg: on ? '#2B0F0A' : 'transparent', fg: on ? '#FFF3E3' : '#2B0F0A', pick: () => this.setState({ spice: n }) };\n      }),\n      qty: s.qty,\n      qtyUp: () => this.setState({ qty: Math.min(20, s.qty + 1) }),\n      qtyDown: () => this.setState({ qty: Math.max(1, s.qty - 1) }),\n      addLabel: `Add ${s.qty} ${meat.name.toLowerCase()} ${fmt.name.toLowerCase()} to your order`,\n      lineTotal: this.gbp(unit * s.qty),\n      addTantuni: () => {\n        this.addLine({ key: `${meat.id}|${fmt.id}|${s.spice}`, name: `${meat.name} tantuni`, detail: `${fmt.name}, ${s.spice.toLowerCase()} chilli`, price: unit, qty: s.qty, img: meat.img });\n        clearTimeout(this.ft);\n        this.setState({ qty: 1, flash: `Added. Want a drink with that?`, step: s.step === 'done' ? 'basket' : s.step });\n        this.ft = setTimeout(() => this.setState({ flash: '' }), 2200);\n      },\n      flash: !!s.flash, flashText: s.flash,\n      drinks: this.DRINKS.map(d => {\n        const line = s.basket.find(l => l.key === 'drink|' + d.id);\n        const q = line ? line.qty : 0;\n        return { ...d, priceLabel: this.gbp(d.price), qty: q, inBasket: q > 0, notInBasket: q === 0,\n          inc: () => this.addLine({ key: 'drink|' + d.id, name: d.name, detail: d.sub, price: d.price, qty: 1, img: d.img }),\n          dec: () => this.change('drink|' + d.id, -1) };\n      }),\n      lines: s.basket.map(l => ({ ...l, total: this.gbp(l.qty * l.price), inc: () => this.change(l.key, 1), dec: () => this.change(l.key, -1) })),\n      empty: count === 0, count, total: this.gbp(total),\n      checkoutBg: count ? '#D62718' : '#D9B79A',\n      isBasket: s.step === 'basket', isCheckout: s.step === 'checkout', isDone: s.step === 'done',\n      toCheckout: () => count && this.setState({ step: 'checkout' }),\n      toBasket: () => this.setState({ step: 'basket' }),\n      name: s.name, phone: s.phone, time: s.time, notes: s.notes, times: this.times(),\n      setName: e => this.setState({ name: e.target.value }),\n      setPhone: e => this.setState({ phone: e.target.value }),\n      setTime: e => this.setState({ time: e.target.value }),\n      setNotes: e => this.setState({ notes: e.target.value }),\n      placeOrder: e => { e.preventDefault(); this.setState({ step: 'done', orderNo: String(1000 + Math.floor(Math.random() * 9000)) }); this.save([]); },\n      firstName: (s.name || '').split(' ')[0],\n      orderNo: s.orderNo,\n      newOrder: () => this.setState({ step: 'basket', notes: '' }),\n      showBar: s.narrow && count > 0 && s.step === 'basket'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
