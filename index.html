document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1201904a-2fb1-43bf-9151-f5f752a2d8ec\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:#FFF3E3;color:#2B0F0A;font-family:Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:#C81E12}\na:hover{color:#9E160C}\n*{box-sizing:border-box}\ndetails summary::-webkit-details-marker{display:none}\n<\u002Fstyle>\n<script type=\"application/ld+json\">{\"@context\":\"https://schema.org\",\"@type\":\"Restaurant\",\"@id\":\"https://mersinlitantuni.co.uk/#restaurant\",\"name\":\"Mersinli Tantuni by Choban\",\"alternateName\":\"Mersinli Tantuni\",\"description\":\"Mersin style tantuni in Norwich. Finely chopped beef, lamb or chicken cooked on a sac and rolled in thin lavash with tomato, sumac onions and parsley.\",\"image\":\"https://mersinlitantuni.co.uk/assets/tantuni-plate-marble.jpg\",\"logo\":\"https://mersinlitantuni.co.uk/assets/logo-choban.jpg\",\"url\":\"https://mersinlitantuni.co.uk/\",\"servesCuisine\":[\"Turkish\",\"Mediterranean\",\"Tantuni\"],\"priceRange\":\"£\",\"address\":{\"@type\":\"PostalAddress\",\"streetAddress\":\"1 Exeter Street\",\"addressLocality\":\"Norwich\",\"addressRegion\":\"Norfolk\",\"postalCode\":\"NR2 4QB\",\"addressCountry\":\"GB\"},\"hasMap\":\"https://www.google.com/maps/search/?api=1&query=1+Exeter+Street+Norwich+NR2+4QB\",\"hasMenu\":\"https://mersinlitantuni.co.uk/menu\",\"acceptsReservations\":false,\"foundingDate\":\"2024\",\"openingHoursSpecification\":[{\"@type\":\"OpeningHoursSpecification\",\"dayOfWeek\":[\"Monday\",\"Tuesday\",\"Wednesday\",\"Thursday\",\"Friday\",\"Saturday\",\"Sunday\"],\"opens\":\"11:00\",\"closes\":\"23:00\"}],\"slogan\":\"Quality, trust, flavour\"}<\u002Fscript>\n<script type=\"application/ld+json\">{\"@context\":\"https://schema.org\",\"@type\":\"FAQPage\",\"mainEntity\":[{\"@type\":\"Question\",\"name\":\"What is Mersin tantuni?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Tantuni is a street food from Mersin, a city on the Mediterranean coast of Turkey. Finely chopped meat is simmered, then fried on a sac, a wide shallow steel pan, with chilli flakes. It is rolled in thin lavash bread with tomato, sumac onions and parsley.\"}},{\"@type\":\"Question\",\"name\":\"Where can I get tantuni in Norwich?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Mersinli Tantuni by Choban at 1 Exeter Street, Norwich NR2 4QB. We serve beef, lamb, chicken, or mixed beef and lamb tantuni.\"}},{\"@type\":\"Question\",\"name\":\"How much is a tantuni?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Every tantuni is £6.50 and every drink is £1.50.\"}},{\"@type\":\"Question\",\"name\":\"What do people drink with tantuni?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"In Mersin people drink şalgam, a spicy drink made from fermented purple carrots, or ayran, a salted yoghurt drink.\"}},{\"@type\":\"Question\",\"name\":\"How is tantuni different from doner?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Doner is sliced off a turning spit. Tantuni is chopped small and cooked to order on a flat pan, so it comes out juicier and finer, and it goes into thin lavash instead of pitta.\"}}]}<\u002Fscript>\n<\u002Fhelmet>\n\n\n<div style=\"min-height:100vh;background:#FFF3E3\">\n\n<header style=\"position:sticky;top:0;z-index:20;background:rgba(255,243,227,0.95);backdrop-filter:blur(8px);border-bottom:1px solid #F1D9C0\">\n  <nav aria-label=\"Main\" style=\"max-width:1240px;margin:0 auto;padding:12px clamp(16px,4vw,40px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n    <a href=\"/\" style=\"display:flex;align-items:center;gap:12px;text-decoration:none;color:#2B0F0A\">\n      <img src=\"/assets/logo-choban.jpg\" alt=\"Mersinli Tantuni by Choban logo\" width=\"44\" height=\"44\" style=\"width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid #F47B20\">\n      <span style=\"display:flex;flex-direction:column;line-height:1.05\">\n        <span style=\"font-family:'DM Serif Display',serif;font-size:21px\">Mersinli Tantuni<\u002Fspan>\n        <span style=\"font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#C81E12;font-weight:700\">by Choban, Norwich<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fa>\n    <div style=\"display:flex;align-items:center;gap:clamp(12px,2.4vw,28px);flex-wrap:wrap;font-size:15px;font-weight:500\">\n      <a href=\"#what-is-tantuni\" style=\"color:#2B0F0A;text-decoration:none\">What is tantuni?<\u002Fa>\n      <a href=\"#meats\" style=\"color:#2B0F0A;text-decoration:none\">Meats<\u002Fa>\n      <a href=\"#visit\" style=\"color:#2B0F0A;text-decoration:none\">Find us<\u002Fa>\n      <a href=\"/menu\" style=\"background:#D62718;color:#FFFFFF;text-decoration:none;padding:11px 20px;border-radius:999px;font-weight:700\" style-hover=\"background:#B21E12\">Order now<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n<\u002Fheader>\n\n<main>\n<section aria-labelledby=\"hero-title\" style=\"max-width:1240px;margin:0 auto;padding:clamp(40px,7vw,96px) clamp(16px,4vw,40px) clamp(48px,7vw,88px);display:flex;flex-wrap:wrap;align-items:center;gap:clamp(32px,5vw,72px)\">\n  <div style=\"flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:24px\">\n    <p style=\"margin:0;display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:0.2em;text-transform:uppercase;font-weight:700;color:#C81E12\">\n      <span style=\"width:28px;height:3px;background:#F47B20\"><\u002Fspan>Street food from Mersin, since 2024\n    <\u002Fp>\n    <h1 id=\"hero-title\" style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(44px,6.4vw,84px);line-height:0.98;letter-spacing:-0.01em;text-wrap:balance\">Proper Mersin tantuni, <em style=\"color:#D62718\">right here in Norwich.<\u002Fem><\u002Fh1>\n    <p style=\"margin:0;font-size:clamp(17px,1.6vw,20px);line-height:1.55;color:#6E3F2E;max-width:34em;text-wrap:pretty\">We chop the meat small, cook it on a hot steel pan and roll it in thin lavash with tomato, onions, sumac and parsley. It's the way they make it back home in Mersin, and it's £6.50.<\u002Fp>\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n      <a href=\"/menu\" style=\"background:#D62718;color:#FFFFFF;text-decoration:none;padding:16px 28px;border-radius:999px;font-weight:700;font-size:17px\" style-hover=\"background:#B21E12\">Order for collection<\u002Fa>\n      <a href=\"#what-is-tantuni\" style=\"border:2px solid #2B0F0A;color:#2B0F0A;text-decoration:none;padding:14px 26px;border-radius:999px;font-weight:700;font-size:17px\" style-hover=\"background:#2B0F0A;color:#FFF3E3\">What is tantuni?<\u002Fa>\n    <\u002Fdiv>\n    <address style=\"font-style:normal;display:flex;align-items:center;gap:10px;font-size:15px;color:#6E3F2E\">\n      <span style=\"width:10px;height:10px;border-radius:50%;background:#F47B20\"><\u002Fspan>1 Exeter Street, Norwich NR2 4QB\n    <\u002Faddress>\n  <\u002Fdiv>\n  <div style=\"flex:1 1 400px;min-width:0;position:relative\">\n    <div style=\"position:absolute;inset:-18px -18px 18px 18px;border-radius:50%;background:repeating-conic-gradient(from 45deg,#F47B20 0 25%,#FFF3E3 0 50%) 0 0/28px 28px;opacity:0.22\"><\u002Fdiv>\n    <img src=\"/assets/tantuni-plate-marble.jpg\" alt=\"Two beef tantuni wraps on a plate with tomato, sumac onions, pickled peppers, lemon and parsley\" style=\"position:relative;width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;box-shadow:0 30px 60px -30px rgba(43,15,10,0.5)\">\n    <div style=\"position:absolute;right:4%;bottom:6%;background:#F47B20;color:#2B0F0A;width:128px;height:128px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:3px solid #FFF3E3;transform:rotate(-8deg)\">\n      <span style=\"font-size:11px;letter-spacing:0.16em;text-transform:uppercase;font-weight:700\">Every wrap<\u002Fspan>\n      <span style=\"font-family:'DM Serif Display',serif;font-size:36px;line-height:1.1;margin-top:4px\">£6.50<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div aria-hidden=\"true\" style=\"height:22px;background:repeating-linear-gradient(90deg,#D62718 0 22px,#FFF3E3 22px 26px,#F47B20 26px 48px,#FFF3E3 48px 52px)\"><\u002Fdiv>\n\n<section id=\"what-is-tantuni\" aria-labelledby=\"what-title\" style=\"background:#FFF9F1\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:clamp(56px,8vw,112px) clamp(16px,4vw,40px);display:flex;flex-direction:column;gap:clamp(40px,5vw,64px)\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:clamp(24px,5vw,72px);align-items:flex-start\">\n      <div style=\"flex:1 1 340px;min-width:0\">\n        <p style=\"margin:0 0 14px;font-size:13px;letter-spacing:0.2em;text-transform:uppercase;font-weight:700;color:#C81E12\">A bit about the dish<\u002Fp>\n        <h2 id=\"what-title\" style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(34px,4.4vw,56px);line-height:1.04;text-wrap:balance\">What is Mersin tantuni?<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"flex:1.4 1 440px;min-width:0;display:flex;flex-direction:column;gap:18px;font-size:18px;line-height:1.65;color:#4A2418\">\n        <p style=\"margin:0;text-wrap:pretty\"><strong style=\"color:#2B0F0A\">Tantuni is a hot wrap from Mersin, a port city on the Mediterranean coast of Turkey.<\u002Fstrong> The meat is chopped into small pieces and simmered first. Then it goes onto the sac, a wide shallow steel pan, with chilli flakes and a little oil. We spoon it into thin lavash with tomato, onions in sumac and a handful of parsley, and roll it up tight.<\u002Fp>\n        <p style=\"margin:0;text-wrap:pretty\">People in Mersin have been eating tantuni from street stalls since the 1940s. They still eat it the same way. Hot, quick, with a squeeze of lemon, some pickled peppers and a cold glass of şalgam.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <ol style=\"list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px\">\n      <li style=\"background:#FFF3E3;border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'DM Serif Display',serif;font-size:44px;line-height:1;color:#F47B20\">01<\u002Fspan>\n        <h3 style=\"margin:0;font-size:20px;font-weight:700\">Simmered, then fried<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;line-height:1.55;color:#6E3F2E\">We poach the chopped meat until it's tender, then finish it on the hot sac so the edges crisp up.<\u002Fp>\n      <\u002Fli>\n      <li style=\"background:#FFF3E3;border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'DM Serif Display',serif;font-size:44px;line-height:1;color:#F47B20\">02<\u002Fspan>\n        <h3 style=\"margin:0;font-size:20px;font-weight:700\">Rolled in lavash<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;line-height:1.55;color:#6E3F2E\">The lavash gets wiped across the pan to pick up the juices before we fill it. That's why tantuni is never dry.<\u002Fp>\n      <\u002Fli>\n      <li style=\"background:#FFF3E3;border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'DM Serif Display',serif;font-size:44px;line-height:1;color:#F47B20\">03<\u002Fspan>\n        <h3 style=\"margin:0;font-size:20px;font-weight:700\">Served like in Mersin<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;line-height:1.55;color:#6E3F2E\">Tomato, sumac onions and parsley go inside. Lemon and pickled peppers come on the side.<\u002Fp>\n      <\u002Fli>\n    <\u002Fol>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"meats\" aria-labelledby=\"meats-title\" style=\"max-width:1240px;margin:0 auto;padding:clamp(56px,8vw,112px) clamp(16px,4vw,40px);display:flex;flex-direction:column;gap:36px\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap\">\n    <div>\n      <p style=\"margin:0 0 14px;font-size:13px;letter-spacing:0.2em;text-transform:uppercase;font-weight:700;color:#C81E12\">Pick your meat<\u002Fp>\n      <h2 id=\"meats-title\" style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(34px,4.4vw,56px);line-height:1.04\">Four kinds of tantuni<\u002Fh2>\n    <\u002Fdiv>\n    <a href=\"/menu\" style=\"font-weight:700;font-size:16px;color:#C81E12\">See the menu and order<\u002Fa>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px\">\n    <a href=\"/menu?meat=beef\" style=\"text-decoration:none;color:#2B0F0A;background:#FFF9F1;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;border:2px solid #F1D9C0\" style-hover=\"border-color:#D62718\">\n      <img src=\"/assets/tantuni-plate-marble.jpg\" alt=\"Beef tantuni\" style=\"width:100%;aspect-ratio:4/3;object-fit:cover\">\n      <div style=\"padding:22px 24px 26px;display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#C81E12;font-weight:700\">Et, the original<\u002Fspan>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\"><h3 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:30px\">Beef<\u002Fh3><span style=\"font-weight:700\">£6.50<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0;font-size:15px;line-height:1.5;color:#6E3F2E\">The classic Mersin recipe. Rich and peppery.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fa>\n    <a href=\"/menu?meat=lamb\" style=\"text-decoration:none;color:#2B0F0A;background:#FFF9F1;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;border:2px solid #F1D9C0\" style-hover=\"border-color:#D62718\">\n      <img src=\"a5e646f0-0d03-4b45-89d4-04c64d87749e\" alt=\"Lamb tantuni wraps cut open\" style=\"width:100%;aspect-ratio:4/3;object-fit:cover\">\n      <div style=\"padding:22px 24px 26px;display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#C81E12;font-weight:700\">Kuzu<\u002Fspan>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\"><h3 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:30px\">Lamb<\u002Fh3><span style=\"font-weight:700\">£6.50<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0;font-size:15px;line-height:1.5;color:#6E3F2E\">A little sweeter and richer than beef.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fa>\n    <a href=\"/menu?meat=chicken\" style=\"text-decoration:none;color:#2B0F0A;background:#FFF9F1;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;border:2px solid #F1D9C0\" style-hover=\"border-color:#D62718\">\n      <img src=\"d239c095-d5d2-4292-abe7-7b35507679bd\" alt=\"Chicken tantuni on a plate\" style=\"width:100%;aspect-ratio:4/3;object-fit:cover\">\n      <div style=\"padding:22px 24px 26px;display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#C81E12;font-weight:700\">Tavuk<\u002Fspan>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\"><h3 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:30px\">Chicken<\u002Fh3><span style=\"font-weight:700\">£6.50<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0;font-size:15px;line-height:1.5;color:#6E3F2E\">Lighter. Great with extra lemon and chilli.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fa>\n    <a href=\"/menu?meat=mix\" style=\"text-decoration:none;color:#2B0F0A;background:#FFF9F1;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;border:2px solid #F1D9C0\" style-hover=\"border-color:#D62718\">\n      <img src=\"a5e646f0-0d03-4b45-89d4-04c64d87749e\" alt=\"Mixed beef and lamb tantuni\" style=\"width:100%;aspect-ratio:4/3;object-fit:cover;object-position:left\">\n      <div style=\"padding:22px 24px 26px;display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#C81E12;font-weight:700\">Karışık<\u002Fspan>\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\"><h3 style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:30px\">Beef and lamb<\u002Fh3><span style=\"font-weight:700\">£6.50<\u002Fspan><\u002Fdiv>\n        <p style=\"margin:0;font-size:15px;line-height:1.5;color:#6E3F2E\">Half and half, cooked together on the same pan.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"salgam-title\" style=\"background:#D62718;color:#FFFFFF\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:clamp(56px,8vw,104px) clamp(16px,4vw,40px);display:flex;flex-wrap:wrap;align-items:center;gap:clamp(32px,6vw,80px)\">\n    <img src=\"/assets/salgam.jpg\" alt=\"Bottle of Turnib şalgam\" style=\"flex:0 1 360px;min-width:0;width:100%;max-width:360px;aspect-ratio:1;object-fit:cover;border-radius:28px;border:4px solid #F47B20\">\n    <div style=\"flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:18px\">\n      <p style=\"margin:0;font-size:13px;letter-spacing:0.2em;text-transform:uppercase;font-weight:700;color:#FFD2A8\">What to drink with it<\u002Fp>\n      <h2 id=\"salgam-title\" style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(34px,4.4vw,56px);line-height:1.04;text-wrap:balance\">In Mersin, tantuni comes with şalgam.<\u002Fh2>\n      <p style=\"margin:0;font-size:18px;line-height:1.6;color:#FFF3E3;max-width:32em;text-wrap:pretty\">Şalgam is a sour, spicy drink made from fermented purple carrots and turnip. If that sounds like a lot, try ayran instead. It's a cold, lightly salted yoghurt drink. All our drinks are £1.50.<\u002Fp>\n      <a href=\"/menu#drinks\" style=\"align-self:flex-start;background:#FFFFFF;color:#C81E12;text-decoration:none;padding:14px 24px;border-radius:999px;font-weight:700\" style-hover=\"background:#FFE7D1\">See the drinks<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section aria-labelledby=\"story-title\" style=\"max-width:1240px;margin:0 auto;padding:clamp(56px,8vw,112px) clamp(16px,4vw,40px);display:flex;flex-wrap:wrap-reverse;align-items:center;gap:clamp(32px,6vw,80px)\">\n  <div style=\"flex:1 1 400px;min-width:0;display:flex;flex-direction:column;gap:18px\">\n    <p style=\"margin:0;font-size:13px;letter-spacing:0.2em;text-transform:uppercase;font-weight:700;color:#C81E12\">Who we are<\u002Fp>\n    <h2 id=\"story-title\" style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(34px,4.4vw,56px);line-height:1.04;text-wrap:balance\">From Mersin to Exeter Street<\u002Fh2>\n    <p style=\"margin:0;font-size:18px;line-height:1.6;color:#4A2418;text-wrap:pretty\"><em>Çoban<\u002Fem> means shepherd in Turkish. We picked the name because good tantuni starts with good meat. We opened in 2024 to bring the taste of Mersin to Norwich, and we still cook every order fresh on the pan.<\u002Fp>\n    <ul style=\"list-style:none;margin:8px 0 0;padding:0;display:flex;gap:10px;flex-wrap:wrap\">\n      <li style=\"padding:9px 16px;border-radius:999px;background:#F47B20;color:#2B0F0A;font-weight:700;font-size:14px\">Quality<\u002Fli>\n      <li style=\"padding:9px 16px;border-radius:999px;background:#F47B20;color:#2B0F0A;font-weight:700;font-size:14px\">Trust<\u002Fli>\n      <li style=\"padding:9px 16px;border-radius:999px;background:#F47B20;color:#2B0F0A;font-weight:700;font-size:14px\">Flavour<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n  <img src=\"/assets/logo-choban.jpg\" alt=\"Mersinli Tantuni by Choban emblem, est. 2024\" style=\"flex:0 1 440px;min-width:0;width:100%;max-width:440px;aspect-ratio:1;object-fit:cover;border-radius:28px;box-shadow:0 24px 48px -28px rgba(43,15,10,0.45)\">\n<\u002Fsection>\n\n<section id=\"faq\" aria-labelledby=\"faq-title\" style=\"background:#FFF9F1\">\n  <div style=\"max-width:880px;margin:0 auto;padding:clamp(56px,8vw,104px) clamp(16px,4vw,40px);display:flex;flex-direction:column;gap:28px\">\n    <h2 id=\"faq-title\" style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(34px,4.4vw,56px);line-height:1.04\">Things people ask us<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;border-top:1px solid #F1D9C0\">\n      <details style=\"border-bottom:1px solid #F1D9C0;padding:22px 0\" open=\"\">\n        <summary style=\"cursor:pointer;list-style:none;font-size:20px;font-weight:700;display:flex;justify-content:space-between;gap:16px\">What is Mersin tantuni?<span style=\"color:#D62718\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"margin:12px 0 0;font-size:17px;line-height:1.6;color:#6E3F2E\">It's street food from Mersin in Turkey. Small pieces of meat are simmered, then fried on a flat pan with chilli flakes and rolled in thin lavash with tomato, sumac onions and parsley.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-bottom:1px solid #F1D9C0;padding:22px 0\">\n        <summary style=\"cursor:pointer;list-style:none;font-size:20px;font-weight:700;display:flex;justify-content:space-between;gap:16px\">Where can I get tantuni in Norwich?<span style=\"color:#D62718\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"margin:12px 0 0;font-size:17px;line-height:1.6;color:#6E3F2E\">Come and see us at 1 Exeter Street, Norwich NR2 4QB. You can walk in or order online and pick it up.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-bottom:1px solid #F1D9C0;padding:22px 0\">\n        <summary style=\"cursor:pointer;list-style:none;font-size:20px;font-weight:700;display:flex;justify-content:space-between;gap:16px\">How much does it cost?<span style=\"color:#D62718\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"margin:12px 0 0;font-size:17px;line-height:1.6;color:#6E3F2E\">Every tantuni is £6.50, whichever meat you pick. Drinks are £1.50.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-bottom:1px solid #F1D9C0;padding:22px 0\">\n        <summary style=\"cursor:pointer;list-style:none;font-size:20px;font-weight:700;display:flex;justify-content:space-between;gap:16px\">Is it the same as doner?<span style=\"color:#D62718\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"margin:12px 0 0;font-size:17px;line-height:1.6;color:#6E3F2E\">No. Doner is sliced off a turning spit. Tantuni is chopped small and cooked to order on a flat pan, so it's juicier, and it goes into thin lavash instead of pitta.<\u002Fp>\n      <\u002Fdetails>\n      <details style=\"border-bottom:1px solid #F1D9C0;padding:22px 0\">\n        <summary style=\"cursor:pointer;list-style:none;font-size:20px;font-weight:700;display:flex;justify-content:space-between;gap:16px\">What should I drink with it?<span style=\"color:#D62718\">+<\u002Fspan><\u002Fsummary>\n        <p style=\"margin:12px 0 0;font-size:17px;line-height:1.6;color:#6E3F2E\">Try şalgam if you like something sour and spicy, or ayran if you want something cool. We have both.<\u002Fp>\n      <\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"visit\" aria-labelledby=\"visit-title\" style=\"max-width:1240px;margin:0 auto;padding:clamp(56px,8vw,112px) clamp(16px,4vw,40px);display:flex;flex-wrap:wrap;gap:clamp(32px,5vw,64px);align-items:stretch\">\n  <div style=\"flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:24px\">\n    <p style=\"margin:0;font-size:13px;letter-spacing:0.2em;text-transform:uppercase;font-weight:700;color:#C81E12\">Find us<\u002Fp>\n    <h2 id=\"visit-title\" style=\"margin:0;font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(34px,4.4vw,56px);line-height:1.04\">We're on Exeter Street<\u002Fh2>\n    <address style=\"font-style:normal;font-size:20px;line-height:1.5\">Mersinli Tantuni by Choban<br>1 Exeter Street<br>Norwich NR2 4QB<br>United Kingdom<\u002Faddress>\n    <div style=\"display:flex;flex-direction:column;gap:6px\">\n      <span style=\"font-size:13px;letter-spacing:0.16em;text-transform:uppercase;font-weight:700;color:#C81E12\">Opening hours<\u002Fspan>\n      <span style=\"font-size:18px\">Every day, 11am to 11pm<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n      <a href=\"/menu\" style=\"background:#D62718;color:#FFFFFF;text-decoration:none;padding:14px 24px;border-radius:999px;font-weight:700\" style-hover=\"background:#B21E12\">Order now<\u002Fa>\n      <a href=\"https://www.google.com/maps/dir/?api=1&amp;destination=1+Exeter+Street%2C+Norwich+NR2+4QB%2C+UK\" target=\"_blank\" rel=\"noopener\" style=\"border:2px solid #2B0F0A;color:#2B0F0A;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:700\">Get directions<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <iframe title=\"Map of 1 Exeter Street, Norwich NR2 4QB\" src=\"https://maps.google.com/maps?q=1%20Exeter%20Street%2C%20Norwich%20NR2%204QB%2C%20United%20Kingdom&amp;t=m&amp;z=17&amp;output=embed&amp;iwloc=near\" loading=\"lazy\" referrerpolicy=\"no-referrer-when-downgrade\" style=\"flex:1.4 1 420px;min-width:0;min-height:400px;border:0;border-radius:24px;box-shadow:0 0 0 4px #F47B20\"><\u002Fiframe>\n<\u002Fsection>\n<\u002Fmain>\n\n<footer style=\"background:#2B0F0A;color:#F6DCC6\">\n  <div aria-hidden=\"true\" style=\"height:14px;background:repeating-linear-gradient(90deg,#D62718 0 22px,#2B0F0A 22px 26px,#F47B20 26px 48px,#2B0F0A 48px 52px)\"><\u002Fdiv>\n  <div style=\"max-width:1240px;margin:0 auto;p
